Chunking:
  Chunk size: 400
  Overlap: 50
  Savepath: Datasets/chunks.json
Embedding:
  Batch: 32
  Model: BAAI/bge-small-en-v1.5
  Savepath: Datasets/embeddings.npy
HNSW:
  Distance Metric: cosine
  EF_construct: 200
  EF_search: 60
  Max Edges: 16
  Savepath: Retrieval/hnsw_index.bin
  dim: 384
  number of elements: 50861
  top_k: 5
LLM:
  Model: qwen3:1.7b
  Prompts:
    Default: Answer the question using your own knowledge when you are confident.
      If the answer is not known well enough, use the provided context. Never mention
      the context unless the information is missing or insufficient. When you know
      the answer, answer directly and do not reference the context.
    Reformat: Rewrite the following text as a clean, well-structured encyclopedia-style
      article. Do not add information that isn't present in the text. Return only
      the article body with no preamble or commentary.
  URL: http://localhost:11434/api/generate
